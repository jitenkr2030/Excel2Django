{% extends "portal/base.html" %}{% block content %}<section class="hero"><div><p class="eyebrow">FAN</p><h1>Welcome,<br><span>{{ user.first_name|default:user.username }}!</span></h1></div><div class="mark">F<span>+</span></div></section><div class="quick-actions">{% for item in stats|slice:":6" %}<a class="button" href="/data/{{ item.name|lower }}/">Browse {{ item.name }}</a>{% endfor %}</div><div class="stats">{% for item in stats %}<a class="card" href="{{ item.url }}"><span>{{ item.name }}</span><strong>{{ item.count }}</strong><small>Browse</small></a>{% endfor %}</div>{% endblock %}
