{% extends "portal/base.html" %}{% block content %}
<div class="heading"><div><p class="eyebrow">SECURITY</p><h1>Change Password</h1></div></div>
<div class="panel"><form method="post" class="form-grid">{% csrf_token %}{% for field in form %}<div class="form-group"><label>{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="field-errors">{{ field.errors }}</div>{% endif %}</div>{% endfor %}<div class="form-actions"><button class="button">Update Password</button><a class="button secondary" href="/auth/profile/">Cancel</a></div></form></div>
{% endblock %}
