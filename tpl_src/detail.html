{% extends "portal/base.html" %}{% load portal_tags %}{% block content %}<div class="heading"><div><p class="eyebrow">DETAIL</p><h1>#{{ obj.pk }}</h1></div><div>{% if user.is_admin_role or user.is_creator_role %}<a class="button" href="/data/{{ model_name }}/{{ obj.pk }}/edit/">Edit</a>{% endif %}<a class="button secondary" href="/data/{{ model_name }}/">Back</a></div></div><div class="panel"><table class="detail-table"><tbody>{% for field in fields %}<tr><th>{{ field.verbose_name|title }}</th><td>{{ obj|lookup:field.name|default:"--" }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
