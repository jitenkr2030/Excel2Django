<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/static/portal/landing.css"></head><body><div class="auth-page"><nav class="auth-nav"><a class="nav-brand" href="/">__T__<span>+</span></a><div class="nav-links"><a href="/auth/login/">Sign In</a></div></nav><div class="auth-main-area"><div class="auth-box"><div class="auth-icon">&#128101;</div><h2>Create Account</h2>{% if form.non_field_errors %}<div class="error-msg">{{ form.non_field_errors }}</div>{% endif %}<form method="post" class="auth-form">{% csrf_token %}<div class="form-row"><div class="auth-field"><label>First Name</label><input name="first_name"></div><div class="auth-field"><label>Last Name</label><input name="last_name"></div></div><div class="auth-field"><label>Username *</label><input name="username" required></div><div class="auth-field"><label>Email *</label><input name="email" type="email" required></div><div class="auth-field"><label>Password *</label><input name="password1" type="password" required></div><div class="auth-field"><label>Confirm *</label><input name="password2" type="password" required></div><div class="role-section"><label>Join as</label><div class="role-option"><label class="role-pill"><input type="radio" name="role" value="creator"><span class="role-icon">__I1__</span>__R1__</label><label class="role-pill"><input type="radio" name="role" value="client" checked><span class="role-icon">__I2__</span>__R2__</label><label class="role-pill"><input type="radio" name="role" value="admin"><span class="role-icon">__I3__</span>__R3__</label></div></div><button class="auth-btn">Create Account</button></form><div class="divider">or</div><div class="auth-links">Have account? <a href="/auth/login/">Sign in</a></div></div></div><div class="footer-note">&copy; 2026 __T__</div></div></body></html>
