{% extends "portal/base.html" %}{% block content %}<section class="hero"><div><p class="eyebrow">CREATOR</p><h1>Hey {{ user.first_name|default:user.username }}!<br><span>Ready to create?</span></h1></div><div class="mark">C<span>+</span></div></section><div class="quick-actions">{% for item in stats|slice:":6" %}<a class="button" href="/data/{{ item.name|lower }}/create/">+ {{ item.name }}</a>{% endfor %}</div><div class="stats">{% for item in stats %}<a class="card" href="{{ item.url }}"><span>{{ item.name }}</span><strong>{{ item.count }}</strong><small>View</small></a>{% endfor %}</div>{% endblock %}
