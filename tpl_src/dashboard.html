{% extends "portal/base.html" %}{% block content %}<section class="hero"><div><p class="eyebrow">ADMIN</p><h1>Welcome,<br><span>{{ user.username }}!</span></h1></div><div class="mark">A<span>+</span></div></section><div class="quick-actions">{% for item in stats %}<a class="button" href="/data/{{ item.name|lower }}/create/">+ {{ item.name }}</a>{% endfor %}</div><p class="eyebrow">OVERVIEW</p><h2>All Data</h2><div class="stats">{% for item in stats %}<a class="card" href="{{ item.url }}"><span>{{ item.name }}</span><strong>{{ item.count }}</strong><small>View</small></a>{% endfor %}</div>{% endblock %}
